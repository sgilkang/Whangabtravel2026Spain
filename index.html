<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>환갑여행 동행수첩</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>환갑여행 동행수첩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef1ec;
  --surface:#ffffff;
  --surface-2:#e4e8e1;
  --ink:#16243a;
  --ink-soft:#56657a;
  --ink-faint:#8a96a6;
  --line:#d7dcd3;
  --azulejo:#2f6f82;
  --azulejo-soft:#e4eff1;
  --gold:#a9781f;
  --gold-soft:#f6ecd4;
  --coral:#b4502f;
  --coral-soft:#f7e6df;
  --good:#3f7d57;
  --good-soft:#e5f0e8;
  --shadow:0 1px 2px rgba(22,36,58,.06), 0 6px 16px rgba(22,36,58,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161f;
    --surface:#1a212c;
    --surface-2:#212a37;
    --ink:#e9edf3;
    --ink-soft:#aab4c4;
    --ink-faint:#707d90;
    --line:#2b3442;
    --azulejo:#6cb2c4;
    --azulejo-soft:#1c3338;
    --gold:#d9b35c;
    --gold-soft:#332a14;
    --coral:#e2906f;
    --coral-soft:#3a241c;
    --good:#7fcb9a;
    --good-soft:#1b3326;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11161f;
  --surface:#1a212c;
  --surface-2:#212a37;
  --ink:#e9edf3;
  --ink-soft:#aab4c4;
  --ink-faint:#707d90;
  --line:#2b3442;
  --azulejo:#6cb2c4;
  --azulejo-soft:#1c3338;
  --gold:#d9b35c;
  --gold-soft:#332a14;
  --coral:#e2906f;
  --coral-soft:#3a241c;
  --good:#7fcb9a;
  --good-soft:#1b3326;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:28px;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:var(--azulejo);}
button{font-family:inherit;}
.wrap{max-width:560px;margin:0 auto;padding:0 14px;}

.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);}
.topbar-inner{max-width:560px;margin:0 auto;padding:14px 14px 12px;}
.topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.trip-title{font-weight:700;font-size:17px;letter-spacing:-.2px;}
.trip-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.dday-chip{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;
  background:var(--azulejo);color:#fff;border-radius:999px;padding:5px 11px;
  white-space:nowrap;
}

.section-label{
  font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-faint);
  text-transform:uppercase;margin:18px 2px 8px;
}
.section-label:first-child{margin-top:14px;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.card-pad{padding:14px 16px;}

.hero{
  background:linear-gradient(135deg,var(--azulejo),#1f5566);
  color:#fff;border-radius:16px;padding:20px 18px;margin:14px 0 4px;
  box-shadow:var(--shadow);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#1c3338,#122026);}
}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1c3338,#122026);}
.hero-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;}
.hero-dday{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:34px;margin:4px 0 2px;letter-spacing:-1px;}
.hero-date{font-size:13px;opacity:.9;}
.hero-note{margin-top:8px;font-size:12.5px;line-height:1.5;opacity:.95;}

/* day card */
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;}
.daycard.is-today{border-color:var(--azulejo);box-shadow:0 0 0 2px var(--azulejo-soft), var(--shadow);}
.daystub{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;}
.daystub-date{text-align:center;min-width:46px;}
.daystub-dow{font-size:10px;color:var(--ink-faint);font-weight:600;}
.daystub-dom{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:20px;line-height:1.1;}
.daystub-mid{flex:1;min-width:0;}
.daystub-region{font-weight:600;font-size:14.5px;}
.daystub-trans{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.daystub-pop{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);flex-shrink:0;}
.daystub-chev{color:var(--ink-faint);font-size:13px;flex-shrink:0;transition:transform .15s;}
.daystub-wx{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none;background:var(--azulejo-soft);border:1px solid var(--line);}
.wx-row{display:flex;flex-wrap:wrap;gap:6px;}
.wx-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 11px;border:1px solid var(--line);background:var(--azulejo-soft);color:var(--azulejo);text-decoration:none;}
.daycard.open .daystub-chev{transform:rotate(90deg);}
.daybody{display:none;padding:0 16px 16px;border-top:1px dashed var(--line);}
.daycard.open .daybody{display:block;}
.daybody-row{margin-top:12px;}
.row-label{font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em;margin-bottom:5px;}
.pillist{display:flex;flex-direction:column;gap:6px;}
.pill-item{font-size:13.5px;line-height:1.5;display:flex;gap:7px;}
.pill-item .dot{flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--azulejo);margin-top:7px;}
.caution-box{background:var(--coral-soft);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--ink);margin-top:12px;}
.caution-box b{color:var(--coral);}
.meal-line{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

/* checklist rows (todo + pretrip) */
.check-row{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;cursor:pointer;}
.chk{flex-shrink:0;width:19px;height:19px;border-radius:6px;border:1.5px solid var(--ink-faint);margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.12s;}
.chk.on{background:var(--good);border-color:var(--good);}
.chk.on::after{content:"✓";color:#fff;font-size:12px;font-weight:700;}
.check-label{font-size:13.5px;line-height:1.45;}
.check-row.done .check-label{color:var(--ink-faint);text-decoration:line-through;}
.check-date{font-size:11px;color:var(--ink-faint);margin-top:2px;}

/* reservation rows */
.res-list{display:flex;flex-direction:column;gap:6px;}
.res-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;}
.res-row-main{flex:1;min-width:0;}
.res-row-kind{font-size:10px;font-weight:700;color:var(--azulejo);letter-spacing:.04em;text-transform:uppercase;}
.res-row-title{font-size:13.5px;font-weight:600;margin-top:1px;}
.res-row-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.res-row-chev{color:var(--ink-faint);font-size:14px;flex-shrink:0;}

/* day memo */
.day-memo textarea{
  width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;background:var(--bg);color:var(--ink);resize:none;min-height:56px;
  overflow:hidden;line-height:1.5;
}
.day-memo-saved{font-size:11px;color:var(--good);opacity:0;transition:opacity .2s;margin-top:4px;height:14px;}
.day-memo-saved.show{opacity:1;}

.helper{font-size:12px;color:var(--ink-faint);line-height:1.6;margin:4px 2px 2px;}

/* reservation / pdf modal */
.res-modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.6);display:none;align-items:flex-end;justify-content:center;}
.res-modal.open{display:flex;}
.res-sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);}
.res-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0;gap:10px;}
.res-sheet-head-text{min-width:0;}
.res-sheet-kind{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--azulejo);text-transform:uppercase;}
.res-sheet-title{font-weight:700;font-size:15.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.res-sheet-head button.close{flex-shrink:0;font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 11px;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);}
.res-body{overflow-y:auto;flex:1;}
.res-body-pad{padding:14px 16px;}
.res-field{margin-bottom:14px;}
.res-field:last-child{margin-bottom:0;}
.res-field-label{font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em;margin-bottom:4px;}
.res-field-value{font-size:14px;line-height:1.55;}
.res-addr-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
.res-addr-btn{font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);text-decoration:none;}
.res-addr-btn.primary{background:var(--azulejo);color:#fff;border-color:var(--azulejo);}
.map-hint{display:none;margin-top:8px;font-size:12.5px;line-height:1.5;background:var(--good-soft);color:var(--ink);border-radius:9px;padding:8px 10px;}
.map-hint.show{display:block;}
.res-row-map{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;text-decoration:none;background:var(--surface);border:1px solid var(--line);}
.place-row{display:flex;flex-wrap:wrap;gap:6px;}
.place-chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;}
.res-flag{font-size:12.5px;background:var(--coral-soft);color:var(--coral);border-radius:9px;padding:9px 11px;line-height:1.5;}
.res-frame-wrap{border-top:1px solid var(--line);flex-direction:column;background:var(--surface-2);}
.res-frame-wrap iframe{border:0;width:100%;height:58vh;background:#fff;}
.res-pages{display:flex;flex-direction:column;gap:10px;padding:12px;}
.res-pages img{display:block;width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:var(--shadow);}
.res-pages-note{font-size:12px;color:var(--ink-faint);text-align:center;line-height:1.5;}
.res-pages-note a{font-weight:600;}
.res-add-btn{margin-top:8px;width:100%;font-size:12.5px;font-weight:600;border-radius:9px;padding:9px;border:1px dashed var(--line);background:transparent;color:var(--azulejo);}

.add-res-form label{font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em;display:block;margin-top:12px;}
.add-res-form label:first-child{margin-top:0;}
.add-res-form select,.add-res-form input[type="text"]{
  width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;background:var(--bg);color:var(--ink);margin-top:6px;
}
.add-res-form input[type="file"]{margin-top:6px;font-size:12.5px;width:100%;}
.add-res-save{margin-top:16px;width:100%;background:var(--azulejo);color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:600;}
.add-res-del{margin-top:10px;width:100%;background:transparent;border:1px solid var(--coral);color:var(--coral);border-radius:9px;padding:10px;font-size:13px;font-weight:600;}

/* photos */
.photo-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;}
.photo-thumb{flex-shrink:0;width:84px;display:flex;flex-direction:column;gap:4px;cursor:pointer;}
.photo-thumb-img{width:84px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
.photo-thumb-img img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb-title{font-size:10.5px;color:var(--ink-soft);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:84px;}
.photo-add-label{appearance:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);cursor:pointer;}
.photo-modal{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.9);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
.photo-modal.open{display:flex;}
.photo-modal img{max-width:92vw;max-height:76vh;border-radius:10px;}
.photo-modal-title{color:#fff;font-size:14px;font-weight:600;margin-top:10px;text-align:center;}
.photo-modal-actions{display:flex;gap:10px;margin-top:16px;}
.photo-modal-actions button{font-size:13px;font-weight:600;border-radius:8px;padding:9px 16px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;}

/* who chip + name gate */
.who-chip{margin-top:8px;font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);}
.name-gate{position:fixed;inset:0;z-index:70;background:rgba(8,10,14,.6);display:none;align-items:center;justify-content:center;padding:20px;}
.name-gate.open{display:flex;}
.name-gate-card{background:var(--surface);border-radius:16px;padding:22px 20px;max-width:360px;width:100%;box-shadow:var(--shadow);}
.name-gate-title{font-weight:700;font-size:17px;}
.name-gate-sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
.name-gate-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;}
.name-gate-list button{font-size:14px;font-weight:600;border-radius:10px;padding:12px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);}
.name-gate-skip{display:block;width:100%;margin-top:14px;font-size:12.5px;color:var(--ink-faint);background:none;border:none;text-decoration:underline;padding:4px;}

/* move records between screens */
.move-sheet textarea{width:100%;font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);color:var(--ink);height:90px;resize:none;}
.move-sec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;}
.move-sec h4{margin:0 0 6px;font-size:14px;}
.move-sec p{margin:0 0 8px;font-size:12.5px;line-height:1.55;color:var(--ink-soft);}
.move-row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap;}
.move-row button{font-size:13px;font-weight:600;border-radius:9px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);}
.move-row button.primary{background:var(--azulejo);border-color:var(--azulejo);color:#fff;}
.move-msg{font-size:12.5px;line-height:1.5;color:var(--good);min-height:18px;}
.move-msg.err{color:var(--coral);}
/* print / PDF export */
.pdf-panel{display:none;position:fixed;left:12px;right:12px;bottom:16px;z-index:80;max-width:536px;margin:0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--azulejo);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.55;box-shadow:0 8px 30px rgba(0,0,0,.25);}
.pdf-panel-go{display:block;width:100%;margin-top:10px;background:var(--azulejo);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14.5px;font-weight:700;}
.pdf-panel-go.alt{background:var(--azulejo-soft);color:var(--azulejo);border:1px solid var(--azulejo);font-size:13.5px;margin-top:8px;}
.pdf-viewer{display:none;position:fixed;inset:0;z-index:90;overflow-y:auto;background:#3a3f45;padding:0 8px 24px;}
.pdf-viewer img{display:block;width:100%;max-width:560px;margin:10px auto;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.pdf-viewer-bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#22262b;color:#fff;font-size:12.5px;line-height:1.4;padding:10px 12px;margin:0 -8px;}
.pdf-viewer-bar button{flex-shrink:0;font-size:13px;font-weight:700;border-radius:8px;padding:8px 14px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;}
.pdf-panel-x{display:block;width:100%;margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--ink-soft);border-radius:10px;padding:9px;font-size:13px;font-weight:600;}
.pdf-sheet{position:absolute;left:-10000px;top:0;width:560px;background:#fff;color:#16243a;padding:0;}
.pdf-sheet .daycard{box-shadow:none;margin:0 0 6px;border-color:#d7dcd3;background:#fff;}
.pdf-sheet .daybody{display:block !important;}
.pdf-sheet .daystub-chev,.pdf-sheet .daystub-wx,.pdf-sheet .res-row-map,.pdf-sheet .res-row-chev,
.pdf-sheet .res-add-btn,.pdf-sheet .photo-add-label,.pdf-sheet .map-hint,.pdf-sheet .day-memo-saved,
.pdf-sheet .wx-row,.pdf-sheet .helper,.pdf-sheet .print-btn{display:none !important;}
.pdf-sheet .daybody-row:has(.wx-row){display:none;}
.pdf-sheet .daybody-row:has(.place-row){display:none;}
.pdf-head{padding:6px 2px 12px;}
.pdf-sheet .photo-strip{flex-direction:column;flex-wrap:nowrap;overflow:visible;gap:14px;}
.pdf-sheet .photo-thumb{width:100%;}
.pdf-sheet .photo-thumb-img{width:100%;height:auto;border-radius:8px;}
.pdf-sheet .photo-thumb-img img{width:100%;height:auto;max-height:640px;object-fit:contain;background:#f4f5f2;}
.pdf-sheet .photo-thumb-title{width:100%;font-size:13px;color:#16243a;text-align:left;white-space:normal;padding:2px 2px 0;}
.pdf-memo{white-space:pre-wrap;font-size:13.5px;line-height:1.5;border:1px solid #d7dcd3;border-radius:9px;padding:9px 10px;background:#fafbf9;}
.print-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:13.5px;font-weight:700;border-radius:12px;padding:13px;border:1px solid var(--azulejo);background:var(--azulejo-soft);color:var(--azulejo);margin:10px 0 14px;}
@media print{
  .topbar,.who-chip,.name-gate,.photo-modal,.res-modal,#resModal,#photoModal,#addPhotoModal,#addResModal,
  .daystub-chev,.daystub-wx,.res-add-btn,.photo-add-label,.day-memo-saved,.res-addr-btn,.print-btn,
  button{display:none !important;}
  body{background:#fff;color:#000;}
  .daybody{display:block !important;}
  .daycard{break-inside:avoid;page-break-inside:avoid;border:1px solid #ccc;margin-bottom:10px;}
  textarea{border:1px solid #ccc;background:#fff;color:#000;}
}
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row">
      <div>
        <div class="trip-title">강신길 환갑여행 동행수첩</div>
        <div class="trip-sub">2026.10.27 – 11.24 · 스페인·포르투갈</div>
      </div>
      <div class="dday-chip" id="topDday">–</div>
    </div>
    <button class="who-chip" id="whoChip">이름 선택</button>
  </div>
</div>

<div class="wrap">

function todayStr(){
  const n = new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function dateObj(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((dateObj(a)-dateObj(b))/86400000); }
function fmtMD(s){ const [,m,d]=s.split("-"); return `${Number(m)}/${Number(d)}`; }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function linkify(s){
  return escapeHtml(s).replace(/(https?:\/\/[^\s<]+)/g, url=>`<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

function renderDday(){
  const t = todayStr();
  const n = diffDays(TRIP_START, t);
  let txt;
  if(n>0) txt = "D-"+n;
  else if(n===0) txt = "D-DAY";
  else if(t<=TRIP_END) txt = "여행중";
  else txt = "여행종료";
  document.getElementById("topDday").textContent = txt;
}

function placesRowHtml(day){
  const ps = PLACES[day.d];
  if(!ps||!ps.length) return "";
  return `<div class="daybody-row"><div class="row-label">📍 가는 곳 지도 (누르면 구글맵)</div><div class="place-row">`+
    ps.map(([label,q,url])=>`<a class="place-chip" data-map-addr="${escapeHtml(q)}" href="${url||mapsUrl(q)}" target="_blank" rel="noopener">${url?"🗺":"📍"} ${escapeHtml(label)}</a>`).join("")+
    `</div><div class="map-hint">지도 창이 막혀서 열리지 않았어요. 장소 이름을 복사해 뒀으니 구글맵 앱 검색창을 길게 눌러 '붙여넣기' 하세요.</div></div>`;
}

function reservationListHtml(day){
  const rows = [];
  (day.tickets||[]).forEach(id=>{
    const t = TICKET_INDEX[id];
    if(!t) return;
    const sub = [t.time, (t.addr||t.meta)].filter(Boolean).join(" · ");
    rows.push(resRowHtml(id, t.kind, t.title, sub, t.addr));
  });
  if(day.lodgeAddr){
    rows.push(resRowHtml("lodge_"+day.d, "숙소", day.stay, day.lodgeAddr, day.lodgeAddr));
  }
  return `<div class="daybody-row">
    <div class="row-label">티켓 · 숙소 · 예약</div>
    <div class="res-list">${rows.join("")}</div>
    <div class="map-hint">지도 창이 막혀서 열리지 않았어요. 주소를 복사해 뒀으니 구글맵 앱 검색창을 길게 눌러 '붙여넣기' 하세요.</div>
    <div class="res-list" data-custom-list="${day.d}"></div>
    <button class="res-add-btn" data-add-res="${day.d}">+ 식당·카페·액티비티 예약 추가</button>
  </div>`;
}

function dayCardHtml(day, isToday){
  const pid = getMyPerson();
  const isSibling = pid && pid!==ALL_ID && !CORE_IDS.includes(pid);
  const sv = (isSibling && day.siblingView) ? day.siblingView : null;
  const vRegion = sv ? sv.region : day.region;
  const vTransport = sv ? sv.transport : day.transport;
  const vStay = sv ? sv.stay : day.stay;
  const vPop = sv && sv.pop ? sv.pop : day.pop;
  const viewDay = sv ? {...day, stay:sv.stay, lodgeAddr:sv.lodgeAddr||"", lodgeRef:sv.lodgeRef||""} : day;
  const body = `
    <div class="daybody">
      ${sv?`<div class="helper" style="margin-bottom:8px">※ 형제팀은 이날 아래 일정으로 별도 이동 — 강신길·최영순 부부와는 합류 전입니다</div>`:""}
      <div class="daybody-row">
        <div class="row-label">숙소</div>
        <div class="pill-item"><div class="dot"></div><div>${escapeHtml(vStay)}</div></div>
      </div>
      ${day.meal?`<div class="meal-line">${escapeHtml(day.meal)}</div>`:""}
      ${weatherRowHtml(day)}
      ${todoListHtml(day, day.todo)}
      ${highlightListHtml(day.highlight)}
      ${placesRowHtml(day)}
      ${reservationListHtml(viewDay)}
      ${day.caution?`<div class="caution-box"><b>⚠ 주의</b> ${escapeHtml(day.caution)}</div>`:""}
      ${day.ref==="plan2"?`<div class="helper">※ 상세 코스는 형제팀(6인 구간) 별도 계획서 기준 — 최종 확정본(10/10 엑셀)과 시간이 다를 수 있습니다.</div>`:""}
      ${dayMemoHtml(day)}
      ${dayPhotosHtml(day)}
    </div>`;
  const openCls = isToday ? " open" : "";
  return `
  <div class="daycard${isToday?" is-today":""}${openCls}" data-date="${day.d}" id="day-${day.d}">
    <div class="daystub" data-toggle>
      <div class="daystub-date">
        <div class="daystub-dow">${day.wd}</div>
        <div class="daystub-dom mono">${fmtMD(day.d)}</div>
      </div>
      <div class="daystub-mid">
        <div class="daystub-region">${escapeHtml(vRegion)}</div>
        <div class="daystub-trans">${escapeHtml(vTransport)}</div>
      </div>
      ${(()=>{ const ks = DAY_WEATHER[day.d]; if(!ks||!ks.length) return ""; const k = ks[ks.length-1];
        return `<a class="daystub-wx" data-weather href="${weatherUrl(k)}" target="_blank" rel="noopener" title="${escapeHtml(WX[k][0])} 시간대별 날씨" aria-label="${escapeHtml(WX[k][0])} 시간대별 날씨">🌤</a>`; })()}
      <div class="daystub-pop">${escapeHtml(vPop)}인</div>
      <div class="daystub-chev">▸</div>
    </div>
    ${body}
  </div>`;
}

function getMyPerson(){ try{ return localStorage.getItem("myPersonId")||""; }catch(e){ return ""; } }

function personLabel(id){ const p = PEOPLE.find(x=>x.id===id); return p?p.label:""; }

function visibleDays(){
  const pid = getMyPerson();
  if(!pid || pid===ALL_ID || CORE_IDS.includes(pid)) return DAYS;
  return DAYS.filter(d=>SIBLING_DATES.includes(d.d));
}

function renderDays(){
  const el = document.getElementById("dayList");
  const list = visibleDays();
  const t = todayStr();
  let focusDate = null;
  for(const d of list){ if(d.d>=t){ focusDate = d.d; break; } }
  el.innerHTML = list.map(d=>dayCardHtml(d, d.d===focusDate)).join("")
    + `<button class="print-btn" data-print-all>📄 전체 일정 PDF로 저장(인쇄) — 메모·사진 다 채운 뒤 눌러보세요</button>`;
  const pid = getMyPerson();
  const label = document.getElementById("scheduleLabel");
  label.textContent = (pid && pid!==ALL_ID && !CORE_IDS.includes(pid))
    ? `${personLabel(pid)}님 일정 (${list.length}일)`
    : `전체 일정 (${list.length}일)`;
  return focusDate;
}

function scrollToFocus(focusDate){
  if(!focusDate) return;
  const card = document.getElementById("day-"+focusDate);
  if(card) setTimeout(()=>card.scrollIntoView({behavior:"smooth", block:"start"}), 100);
}

function toggleCheck(id, rowEl){
  const cur = !!(CHECK_STATE[id] && CHECK_STATE[id].done);
  const next = !cur;
  rowEl.querySelector(".chk").classList.toggle("on", next);
  rowEl.classList.toggle("done", next);
  CHECK_STATE[id] = {done: next, at: Date.now()};
  saveJSON("checkState", CHECK_STATE);
  if(id.startsWith("pre_")){
    const stub = document.querySelector("#pretripDaycard .daystub-trans");
    if(stub){
      const doneCount = PRETRIP_CHECK.filter(i=>CHECK_STATE[i.id]&&CHECK_STATE[i.id].done).length;
      stub.textContent = doneCount+"/"+PRETRIP_CHECK.length+" 완료";
    }
  }
  if(id.startsWith("mid_")){
    const stub = document.querySelector("#midtripDaycard .daystub-trans");
    if(stub){
      const doneCount = MIDTRIP_CHECK.filter(i=>CHECK_STATE[i.id]&&CHECK_STATE[i.id].done).length;
      stub.textContent = doneCount+"/"+MIDTRIP_CHECK.length+" 완료";
    }
  }
}

function copyText(str){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).catch(()=>fallbackCopy(str));
  } else {
    fallbackCopy(str);
  }
}
function fallbackCopy(str){
  try{
    const ta = document.createElement("textarea");
    ta.value = str; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }catch(e){}
}
function mapsUrl(addr){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
}
function buildReservation(resId){
  if(resId.indexOf("lodge_")===0){
    const date = resId.slice(6);
    const day = DAYS.find(d=>d.d===date);
    if(!day) return null;
    return {kind:"숙소", title:day.stay, when:"", addr:day.lodgeAddr, ref:day.lodgeRef, asset:null, flag:null};
  }
  const t = TICKET_INDEX[resId];
  if(!t) return null;
  return {
    kind: t.kind,
    title: t.title,
    when: [t.date?fmtMD(t.date):"", t.time].filter(Boolean).join(" · "),
    addr: t.addr || "",
    metaExtra: t.meta || "",
    ref: t.ref,
    asset: t.asset,
    flag: t.flag,
    maps: t.maps
  };
}

document.addEventListener("click", (e)=>{
  if(e.target.closest("[data-weather]")) return;
  // 지도에서 보기: 앱 안 화면(카톡·Claude 앱 등)은 새 창 링크를 막는 경우가 있어
  // ① 새 창 → ② 현재 화면에서 구글맵으로 이동 → ③ 둘 다 막히면 주소 복사 + 안내 순서로 시도
  const mapLink = e.target.closest("[data-map-addr]");

    e.preventDefault();
    const url = mapLink.getAttribute("href");
    let opened = null;
    try{ opened = window.open(url, "_blank"); if(opened) opened.opener = null; }catch(err){}
    if(opened) return;
    try{ window.top.location.href = url; return; }catch(err){}
    copyText(mapLink.dataset.mapAddr);

  const stub = e.target.closest("[data-toggle]");
  if(stub){ const card = stub.closest(".daycard"); card.classList.toggle("open"); autosizeMemosIn(card); return; }

  const chk = e.target.closest("[data-check]");

  const resRow = e.target.closest("[data-open-res]");

    copyBtn.textContent = "복사됨";

});

const PHOTO_DB_NAME = "tripPhotosDB";
const PHOTO_STORE = "photos";
const CUSTOM_RES_STORE = "customRes";
let photoDbPromise = null;
function openPhotoDB(){
  if(photoDbPromise) return photoDbPromise;
  photoDbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("no-idb")); return; }
    const req = indexedDB.open(PHOTO_DB_NAME, 3);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(PHOTO_STORE)){
        const store = db.createObjectStore(PHOTO_STORE, {keyPath:"id", autoIncrement:true});
        store.createIndex("date","date",{unique:false});
      }
      if(!db.objectStoreNames.contains("moveParts")){
        db.createObjectStore("moveParts", {keyPath:"key"});
      }
      if(!db.objectStoreNames.contains(CUSTOM_RES_STORE)){
        const store2 = db.createObjectStore(CUSTOM_RES_STORE, {keyPath:"id", autoIncrement:true});
        store2.createIndex("date","date",{unique:false});
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return photoDbPromise;
}
async function addCustomRes(entry){
  const db = await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(CUSTOM_RES_STORE,"readwrite");
    const req = tx.objectStore(CUSTOM_RES_STORE).add(entry);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function getCustomResForDate(date){
  const db = await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(CUSTOM_RES_STORE,"readonly");
    const req = tx.objectStore(CUSTOM_RES_STORE).index("date").getAll(date);
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = ()=>reject(req.error);
  });
}
async function getCustomResById(id){
  const db = await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(CUSTOM_RES_STORE,"readonly");
    const req = tx.objectStore(CUSTOM_RES_STORE).get(id);
    req.onsuccess = ()=>resolve(req.result||null);
    req.onerror = ()=>reject(req.error);
  });
}
async function deleteCustomRes(id){
  const db = await openPhotoDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(CUSTOM_RES_STORE,"readwrite");
    tx.objectStore(CUSTOM_RES_STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function paintCustomRes(date){
  const el = document.querySelector(`[data-custom-list="${date}"]`);
  if(!el) return;
  let items = [];
  try{ items = await getCustomResForDate(date); }catch(e){ return; }
  el.innerHTML = items.map(it=>{
    const sub = [it.time, it.addr].filter(Boolean).join(" · ");
    return resRowHtml("custom_"+it.id, it.kind+" · 직접입력", it.title, sub);
  }).join("");

function resizeImageFile(file, maxDim){
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h*maxDim/w); w = maxDim; }
        else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob((blob)=>{
        URL.revokeObjectURL(url);
        resolve(blob || file);
      }, "image/jpeg", 0.82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

let pdfBusy = false;
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement("script"); s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function setPdfStatus(text){
  document.querySelectorAll("[data-print-all]").forEach(b=>{
    if(!b.dataset.label) b.dataset.label = b.textContent;
    b.textContent = text || b.dataset.label;
    b.disabled = !!text;
  });
}
function buildPdfSheet(){
  const sheet = document.createElement("div");
  sheet.className = "pdf-sheet";
  const head = document.createElement("div");
  head.className = "pdf-head";
  head.innerHTML = `<div class="trip-title">강신길 환갑여행 동행수첩</div><div class="trip-sub">2026.10.27 – 11.24 · 스페인·포르투갈</div>`;
  sheet.appendChild(head);
  document.querySelectorAll("#dayList .daycard").forEach(card=>{
    const c = card.cloneNode(true);
    c.classList.add("open"); c.classList.remove("is-today");
    c.removeAttribute("id");
    c.querySelectorAll("textarea[data-memo]").forEach(ta=>{
      const v = DAY_NOTES[ta.dataset.memo] || "";
      const d = document.createElement("div");
      d.className = "pdf-memo"; d.textContent = v || "(메모 없음)";
      ta.replaceWith(d);
    });
    sheet.appendChild(c);
  });
  document.body.appendChild(sheet);
  return sheet;
}

  try{
    pdfPanel(`<b>PDF 준비 중…</b>`);
    pdfPanel(`<b>PDF 도구 불러오는 중…</b>`);
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    sheet = buildPdfSheet();
    pdfImages = [];
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:"mm", format:"a4"});
    const pageW = 210, pageH = 297, margin = 10, usableW = pageW - margin*2, usableH = pageH - margin*2;
    const blocks = Array.from(sheet.children);
    let y = margin, first = true;
    for(let i=0;i<blocks.length;i++){
      pdfPanel(`<b>PDF 만드는 중… (${i+1}/${blocks.length})</b><br>화면을 끄지 말고 잠시 기다려 주세요.`);
      await new Promise(r=>setTimeout(r, 0));   // 화면이 멈추지 않게 한 장씩 숨 돌리기
      const canvas = await html2canvas(blocks[i], {scale:1.3, backgroundColor:"#ffffff", useCORS:true, logging:false});
      const pxPerMm = canvas.width / usableW;
      let srcY = 0;
      while(srcY < canvas.height){
        let room = (pageH - margin) - y;
        if(room < 30 && !first){ pdf.addPage(); y = margin; room = usableH; }
        const sliceH = Math.min(canvas.height - srcY, Math.floor(room * pxPerMm));
        const part = document.createElement("canvas");
        part.width = canvas.width; part.height = sliceH;
        part.getContext("2d").drawImage(canvas, 0, srcY, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
        const hMm = sliceH / pxPerMm;
        const jpg = part.toDataURL("image/jpeg", 0.8);
        pdfImages.push(jpg);
        pdf.addImage(jpg, "JPEG", margin, y, usableW, hMm);
        first = false;
        srcY += sliceH; y += hMm + 4;
        if(srcY < canvas.height){ pdf.addPage(); y = margin; }
      }
      canvas.width = canvas.height = 0;   // 메모리 정리
    }
    sheet.remove(); sheet = null;
    pdfBlob = pdf.output("blob");
    pdfPages = pdf.getNumberOfPages();
    // 저장은 한 번 더 눌러서 진행(폰에서 저장 창이 눌림 직후에만 뜨는 경우 대비)
    showPdfReady();
  }catch(err){
    pdfPanel(`<b>PDF를 만들지 못했어요.</b><br>인터넷 연결을 확인하고 다시 눌러주세요.<br><span style="opacity:.7;font-size:11px">(${escapeHtml(String(err && (err.message||err.code) || err))})</span><button class="pdf-panel-x" data-pdf-close>닫기</button>`);
  }finally{
    if(sheet) sheet.remove();
    pdfBusy = false;
  }
}

// ① Claude 화면의 저장 기능(로그인·권한에 따라 '구성원만 가능'으로 막힐 수 있음)
async function savePdfNow(){
  if(!pdfBlob) return;
  const downloads = await (pdfDownloads || getDownloads());
  if(!downloads){ showPdfReady("이 화면에서는 'PDF 저장하기'가 막혀 있어요. 아래 '공유창' 또는 '바로 다운로드'를 눌러 보세요."); return; }
  try{
    await downloads.save({filename:PDF_NAME, data:pdfBlob});
    pdfPanel(`<b>저장했어요 ✓</b><br>폰의 '다운로드'(내 파일) 폴더에서 열 수 있어요.<button class="pdf-panel-x" data-pdf-close>닫기</button>`);
  }catch(err){
    const code = err && err.code;
    if(code==="declined") showPdfReady("저장을 취소했어요. 다시 누르거나 다른 방법을 써 보세요.");
    else if(code==="rate_limited") showPdfReady("저장 창이 이미 열려 있어요. 잠시 후 다시 눌러주세요.");
    else showPdfReady("이 방법은 막혀 있어요(구성원만 저장 가능 등). 아래 '공유창' 또는 '바로 다운로드'를 눌러 보세요.");
  }
}

// ② 안드로이드 공유창 — Claude 저장 기능을 거치지 않음
async function sharePdfNow(){
  if(!pdfBlob) return;
  try{
    const file = new File([pdfBlob], PDF_NAME, {type:"application/pdf"});
    if(!(navigator.canShare && navigator.canShare({files:[file]}))){
      showPdfReady("이 브라우저는 공유창을 지원하지 않아요. 'PDF 다운로드'를 눌러 주세요."); return;
    }
    await navigator.share({files:[file], title:"환갑여행 동행수첩"});
    pdfPanel(`<b>공유창으로 보냈어요 ✓</b><br>'내 파일'·구글 드라이브·카톡 '나와의 채팅' 등에 저장하면 돼요.<button class="pdf-panel-x" data-pdf-close>닫기</button>`);
  }catch(err){
    if(err && err.name === "AbortError") showPdfReady("공유를 취소했어요.");
    else showPdfReady("공유창을 열지 못했어요. 'PDF 다운로드'를 눌러 주세요.");
  }
}
// 새 탭에 PDF를 띄움 — 그 탭의 메뉴(⋮)에서 인쇄·공유

// ③ 브라우저 기본 다운로드 — Claude 저장 기능을 거치지 않음
function directPdfNow(){
  if(!pdfBlob) return;
  try{
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement("a"); a.href = url; a.download = PDF_NAME; a.rel = "noopener";

// ===== 기록 옮기기 =====
// 앱 안 화면 ↔ 크롬 화면은 저장 공간이 따로라서, 기록을 '옮기기 코드'(글자)로 바꿔 복사→붙여넣기로 옮김
const MOVE_CHUNK = 300000;
let moveParts = [], moveIdx = 0;
function idbGetAll(store){
  return openPhotoDB().then(db=>new Promise((res,rej)=>{
    const r = db.transaction(store,"readonly").objectStore(store).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
  }));
}
function idbPut(store, val){
  return openPhotoDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction(store,"readwrite"); tx.objectStore(store).put(val);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  }));
}
function idbClear(store){
  return openPhotoDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction(store,"readwrite"); tx.objectStore(store).clear();
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  }));
}
function blobToDataURL(b){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(b); }); }
async function dataURLToBlob(u){ return (await fetch(u)).blob(); }

  if(m) return m;
  m = document.createElement("div"); m.id="moveModal"; m.className="res-modal";

  <div class="res-body"><div class="res-body-pad move-sheet">
    <div class="move-sec"><h4>① 보내기 — 기록이 있는 화면에서</h4>

        <textarea id="moveOutText" readonly></textarea>
      </div>
      <div class="move-msg" id="moveOutMsg"></div>
    </div>
    <div class="move-sec"><h4>② 받기 — 기록을 옮겨 올 화면에서</h4>
      <p>아래 칸을 길게 눌러 <b>붙여넣기</b> 하세요. 코드가 여러 개면 하나씩 붙여넣으면 돼요(순서 상관없음). 다 모이면 자동으로 옮겨져요. 이미 있는 기록은 지워지지 않아요.</p>
      <textarea id="moveInText" placeholder="여기에 옮기기 코드 붙여넣기"></textarea>
      <div class="move-row"><button class="primary" data-move-import>가져오기</button></div>
      <div class="move-msg" id="moveInMsg"></div>
    </div>
  </div></div></div>`;
  document.body.appendChild(m);
  return m;
}
function moveMsg(id, text, err){ const el=document.getElementById(id); el.textContent=text; el.classList.toggle("err", !!err); }
function showMovePart(){
  document.getElementById("moveOut").style.display = "block";
  document.getElementById("moveIdxLabel").textContent = `코드 ${moveIdx+1} / ${moveParts.length}`;
  document.getElementById("moveOutText").value = moveParts[moveIdx];
}
async function makeMoveCode(){
  moveMsg("moveOutMsg","코드 만드는 중… 사진이 많으면 조금 걸려요.");
  try{
    document.querySelectorAll("textarea[data-memo]").forEach(saveMemoNow);
    const photos = await idbGetAll(PHOTO_STORE).catch(()=>[]);
    const res = await idbGetAll(CUSTOM_RES_STORE).catch(()=>[]);
    const outPhotos = [];
    for(let i=0;i<photos.length;i++){
      moveMsg("moveOutMsg",`사진 준비 중… (${i+1}/${photos.length})`);
      const small = await resizeImageFile(photos[i].blob, 1280);
      outPhotos.push({date:photos[i].date, title:photos[i].title||"", addedAt:photos[i].addedAt||0, data: await blobToDataURL(small)});
    }
    const outRes = [];
    for(const r of res){
      const o = {date:r.date, kind:r.kind, title:r.title, time:r.time, addr:r.addr, ref:r.ref, addedAt:r.addedAt||0, fileType:r.fileType||""};
      if(r.fileBlob) o.fileData = await blobToDataURL(r.fileBlob);
      outRes.push(o);
    }
    const json = JSON.stringify({v:1, notes:DAY_NOTES, checks:CHECK_STATE, photos:outPhotos, res:outRes});
    const id = Math.random().toString(36).slice(2,8);
    const n = Math.max(1, Math.ceil(json.length / MOVE_CHUNK));
    moveParts = [];
    for(let i=0;i<n;i++) moveParts.push(`HGT1|${id}|${i+1}|${n}|` + json.slice(i*MOVE_CHUNK,(i+1)*MOVE_CHUNK));
    moveIdx = 0; showMovePart();
    const memoCount = Object.values(DAY_NOTES).filter(v=>v&&v.trim()).length;
    moveMsg("moveOutMsg",`준비 완료: 메모 ${memoCount}개 · 사진 ${outPhotos.length}장 · 추가 예약 ${outRes.length}개 → 코드 ${n}개`);
  }catch(e){ moveMsg("moveOutMsg","코드를 만들지 못했어요. 다시 눌러 주세요.", true); }
}
async function copyMovePart(){
  const ta = document.getElementById("moveOutText");
  const text = ta.value;
  let ok = false;
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); ok = true; } }catch(e){}
  if(!ok){ try{ ta.removeAttribute("readonly"); ta.focus(); ta.select(); ok = document.execCommand("copy"); ta.setAttribute("readonly",""); }catch(e){} }
  moveMsg("moveOutMsg", ok ? `코드 ${moveIdx+1}/${moveParts.length} 복사됨 ✓ — 받을 화면의 ② 칸에 붙여넣으세요.` : "자동 복사가 막혔어요. 위 칸을 길게 눌러 '전체 선택' → '복사' 해 주세요.", !ok);
}
let moveImporting = false;
async function importMoveText(){
  if(moveImporting) return;
  moveImporting = true;
  try{ await importMoveTextInner(); } finally { moveImporting = false; }
}
async function importMoveTextInner(){
  const raw = (document.getElementById("moveInText").value||"").trim();
  if(!raw){ moveMsg("moveInMsg","붙여넣은 코드가 없어요.", true); return; }
  const m = raw.match(/^HGT1\|([a-z0-9]+)\|(\d+)\|(\d+)\|([\s\S]*)$/);
  if(!m){ moveMsg("moveInMsg","옮기기 코드가 아니에요. 코드를 처음부터 끝까지 다 복사했는지 확인해 주세요.", true); return; }
  const [, id, iStr, nStr, body] = m; const i = +iStr, n = +nStr;
  try{
    await idbPut("moveParts", {key:id+"_"+i, id, i, n, body});
    const all = (await idbGetAll("moveParts")).filter(p=>p.id===id);
    document.getElementById("moveInText").value = "";
    if(all.length < n){
      const have = all.map(p=>p.i).sort((a,b)=>a-b);
      moveMsg("moveInMsg",`코드 ${i}/${n} 받음 ✓ (지금까지 ${have.join(", ")}번) — 나머지 코드도 붙여넣어 주세요.`);
      return;
    }
    moveMsg("moveInMsg","모두 받았어요. 옮기는 중…");
    const json = all.sort((a,b)=>a.i-b.i).map(p=>p.body).join("");
    const data = JSON.parse(json);
    // 메모: 비어 있으면 채우고, 둘 다 있으면 뒤에 덧붙임
    let memoN = 0;
    for(const [d,v] of Object.entries(data.notes||{})){
      if(!v || !v.trim()) continue;
      const cur = DAY_NOTES[d] || "";
      if(cur.includes(v)) continue;
      DAY_NOTES[d] = cur.trim() ? cur + "\n" + v : v; memoN++;
    }
    saveJSON("dayNotes", DAY_NOTES);
    for(const [k,v] of Object.entries(data.checks||{})){ if(v && v.done && !(CHECK_STATE[k]&&CHECK_STATE[k].done)) CHECK_STATE[k] = v; }
    saveJSON("checkState", CHECK_STATE);
    // 사진: 같은 날짜·시각·제목이 이미 있으면 건너뜀
    const exist = new Set((await idbGetAll(PHOTO_STORE)).map(p=>p.date+"|"+(p.addedAt||0)+"|"+(p.title||"")));
    let photoN = 0;
    for(const p of (data.photos||[])){
      const key = p.date+"|"+(p.addedAt||0)+"|"+(p.title||"");
      if(exist.has(key)) continue;
      const blob = await dataURLToBlob(p.data);
      await idbPut(PHOTO_STORE, {date:p.date, blob, title:p.title||"", addedAt:p.addedAt||Date.now()});
      exist.add(key); photoN++;
    }
    const existRes = new Set((await idbGetAll(CUSTOM_RES_STORE)).map(r=>r.date+"|"+(r.addedAt||0)+"|"+r.title));
    let resN = 0;
    for(const r of (data.res||[])){
      const key = r.date+"|"+(r.addedAt||0)+"|"+r.title;
      if(existRes.has(key)) continue;
      const entry = {date:r.date, kind:r.kind, title:r.title, time:r.time, addr:r.addr, ref:r.ref, addedAt:r.addedAt||Date.now()};
      if(r.fileData){ entry.fileBlob = await dataURLToBlob(r.fileData); entry.fileType = r.fileType||entry.fileBlob.type; }
      await idbPut(CUSTOM_RES_STORE, entry);
      existRes.add(key); resN++;
    }
    await idbClear("moveParts");
    renderPretrip(); renderMidtrip(); refreshSchedule();
    moveMsg("moveInMsg",`옮기기 완료 ✓ 메모 ${memoN}개 · 사진 ${photoN}장 · 추가 예약 ${resN}개를 가져왔어요.`);
  }catch(e){ moveMsg("moveInMsg","가져오지 못했어요. 코드가 잘렸을 수 있어요 — 그 번호 코드를 다시 복사해 붙여넣어 주세요.", true); }
}
document.addEventListener("click",(e)=>{
  if(e.target.closest("[data-move-open]")){ moveModal().classList.add("open"); return; }
  if(e.target.closest("[data-move-close]") || e.target.id==="moveModal"){ const m=document.getElementById("moveModal"); if(m) m.classList.remove("open"); return; }
  if(e.target.closest("[data-move-make]")){ makeMoveCode(); return; }
  if(e.target.closest("[data-move-copy]")){ copyMovePart(); return; }
  if(e.target.closest("[data-move-prev]")){ if(moveIdx>0){ moveIdx--; showMovePart(); } return; }
  if(e.target.closest("[data-move-next]")){ if(moveIdx<moveParts.length-1){ moveIdx++; showMovePart(); } return; }
  if(e.target.closest("[data-move-import]")){ importMoveText(); return; }
});
document.addEventListener("input",(e)=>{ if(e.target.id==="moveInText" && /^HGT1\|/.test(e.target.value.trim())) setTimeout(importMoveText, 50); });

function refreshSchedule(){
  const focusDate = renderDays();
  autosizeMemosIn();
  scrollToFocus(focusDate);
  DAYS.forEach(d=>{ paintPhotoStrip(d.d); paintCustomRes(d.d); });
}

document.addEventListener("click",(e)=>{
  if(e.target.id==="whoChip"){ openNameGate(); return; }
  const pick = e.target.closest("[data-pick-name]");
  if(pick){
    setMyPerson(pick.dataset.pickName);
    closeNameGate();
    renderWhoChip();
    refreshSchedule();
    return;
  }
  if(e.target.id==="nameGateSkip"){
    setMyPerson(ALL_ID);
    closeNameGate();
    renderWhoChip();
    refreshSchedule();
    return;
  }
});

renderDday();
renderBanner();
renderPretrip();
renderMidtrip();
renderNameGate();
renderWhoChip();
refreshSchedule();
if(!getMyPerson()) openNameGate();
</script>

</body></html>
